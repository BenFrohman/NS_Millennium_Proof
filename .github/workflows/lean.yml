name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (lake)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: |
          cat lean-toolchain
          elan --version
          lake --version
          lean --version

      - name: Fetch Mathlib build cache
        run: lake exe cache get || echo "::warning::Mathlib cache miss; the build step will compile dependencies from source (slow)."

      - name: Build project
        run: |
          set -o pipefail
          mkdir -p cert-out
          lake build 2>&1 | tee cert-out/lake-build.log

      - name: Build ForMathlib library (not in the default target)
        run: lake build ForMathlib

      - name: No sorry / admit / native_decide / axiom declarations (comments excluded; every scanned module must be in the strict audit)
        run: |
          python3 scripts/check_forbidden_tokens.py \
            --require-imported-by scripts/StrictAxiomAudit.lean \
            NS_Millennium_Proof.lean NS_Millennium_Proof/Modules NS_Millennium_Proof/Definitions \
            ForMathlib

      - name: Strict whole-library axiom audit (fails on any axiom beyond propext, Classical.choice, Quot.sound)
        run: |
          set -o pipefail
          mkdir -p cert-out
          lake env lean scripts/StrictAxiomAudit.lean 2>&1 | tee strict-axiom-audit.txt cert-out/strict-axiom-audit.txt
          grep -q '^STRICT AUDIT PASS' strict-axiom-audit.txt
          if grep -v '^STRICT AUDIT PASS' strict-axiom-audit.txt | grep -qE 'STRICT AUDIT FAIL|sorryAx|ofReduceBool|error:'; then exit 1; fi
          grep '^STRICT AUDIT SUMMARY' strict-axiom-audit.txt

      - name: Audit envelope correction and backwards-compatible API
        run: |
          set -o pipefail
          python3 scripts/check_envelope_axioms.py | tee envelope-axioms.txt
          lake env lean scripts/CertificateAxiomInventory.lean | tee certificate-axiom-inventory.txt


      - name: Collect lake-manifest provenance into cert-out
        if: always()
        run: |
          mkdir -p cert-out
          if [ -f lake-manifest.json ]; then
            cp -a lake-manifest.json cert-out/lake-manifest.json
            sha256sum lake-manifest.json | tee cert-out/lake-manifest.json.sha256sum
            awk '{print $1}' cert-out/lake-manifest.json.sha256sum > cert-out/lake-manifest.json.sha256
          else
            echo "MISSING: lake-manifest.json was not present in the checkout" | tee cert-out/MISSING-lake-manifest.txt
          fi
          if [ -f lean-toolchain ]; then
            cp -a lean-toolchain cert-out/lean-toolchain
            sha256sum lean-toolchain | tee cert-out/lean-toolchain.sha256sum
            awk '{print $1}' cert-out/lean-toolchain.sha256sum > cert-out/lean-toolchain.sha256
          else
            echo "MISSING: lean-toolchain was not present in the checkout" | tee cert-out/MISSING-lean-toolchain.txt
          fi
          {
            echo "commit: $(git rev-parse HEAD 2>/dev/null || echo not available)"
            echo "github_sha: ${GITHUB_SHA:-not set in environment}"
            echo "github_run_id: ${GITHUB_RUN_ID:-not set in environment}"
            echo "github_run_attempt: ${GITHUB_RUN_ATTEMPT:-not set in environment}"
            echo "github_event_name: ${GITHUB_EVENT_NAME:-not set in environment}"
            echo "github_repository: ${GITHUB_REPOSITORY:-not set in environment}"
            echo "elan --version:"
            if command -v elan >/dev/null 2>&1; then elan --version; else echo "elan was not on PATH"; fi
            echo "lake --version:"
            if command -v lake >/dev/null 2>&1; then lake --version; else echo "lake was not on PATH"; fi
            echo "lean --version:"
            if command -v lean >/dev/null 2>&1; then lean --version; else echo "lean was not on PATH"; fi
          } > cert-out/versions.txt 2>&1
          cat cert-out/versions.txt
          python3 -c '
          import json, pathlib
          dest = pathlib.Path("cert-out/mathlib-rev.txt")
          manifest = pathlib.Path("lake-manifest.json")
          if not manifest.exists():
              dest.write_text("Mathlib rev: not available; lake-manifest.json missing\n")
              raise SystemExit(0)
          try:
              data = json.loads(manifest.read_text())
          except Exception as e:
              dest.write_text("Mathlib rev: could not parse lake-manifest.json (%s)\n" % e)
              raise SystemExit(0)
          lines = []
          found = False
          for pkg in data.get("packages") or []:
              if pkg.get("name") == "mathlib":
                  lines.append("name: mathlib")
                  lines.append("rev: %s" % pkg.get("rev"))
                  lines.append("inputRev: %s" % pkg.get("inputRev"))
                  lines.append("url: %s" % pkg.get("url"))
                  found = True
                  break
          if not found:
              lines.append("Mathlib rev: no package named mathlib in lake-manifest.json")
          dest.write_text("\n".join(lines) + "\n")
          '

      - name: Upload certificate files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lean-certificate
          path: cert-out/

  structure:
    name: Repository structure check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required project files are present
        run: |
          set -e
          fail=0
          for f in lakefile.lean lean-toolchain lake-manifest.json LICENSE README.md; do
            if [ -e "$f" ]; then echo "ok   $f"; else echo "MISS $f"; fail=1; fi
          done
          echo "--- core modules ---"
          for m in Modules/NS_Equations.lean Modules/SymplecticTether.lean \
                   Modules/TetheredLyapunov.lean Modules/GlobalRegularity.lean \
                   Modules/IndependentMajorant.lean ForMathlib/NS/Tether.lean; do
            if [ -e "$m" ]; then echo "ok   $m"; else echo "MISS $m"; fail=1; fi
          done
          exit $fail

      - name: Confirm toolchain pin matches lakefile note
        run: |
          grep -q "leanprover/lean4:" lean-toolchain && echo "toolchain pin present: $(cat lean-toolchain)"
