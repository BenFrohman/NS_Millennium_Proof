# PipelineHalt paper-vs-Lean alignment check.
# PipelineHalt is currently a private repository. This workflow is manual-only
# (workflow_dispatch). If the PIPELINEHALT_TOKEN secret is missing, the run
# fails. The run fails whenever the check fails or cannot run.
name: PipelineHalt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipelinehalt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check PipelineHalt access
        id: access
        env:
          TOKEN: ${{ secrets.PIPELINEHALT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::PIPELINEHALT_TOKEN is not set, so the PipelineHalt check cannot run. This run fails; it does not pass a check that did not run."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.access.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Build PipelineHalt
        if: steps.access.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.PIPELINEHALT_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/BenFrohman/PipelineHalt.git" "$RUNNER_TEMP/ph"
          cd "$RUNNER_TEMP/ph" && npm ci && npm run build
      - name: Run PipelineHalt
        if: steps.access.outputs.ok == 'true'
        run: |
          node "$RUNNER_TEMP/ph/dist/src/bin.js" check --ci \
            --anchor .pipelinehalt/anchor.json --lean ForMathlib NS_Millennium_Proof \
            --report-md pipelinehalt-report.md --pending pipelinehalt-pending.json
          if [ -f pipelinehalt-report.md ]; then cat pipelinehalt-report.md >> "$GITHUB_STEP_SUMMARY"; fi
