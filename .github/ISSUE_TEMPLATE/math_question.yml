name: Mathematical question or concern
description: A question about a definition, lemma, proof step, or the scope of a claim
labels: ["question"]
body:
  - type: textarea
    id: concern
    attributes:
      label: Question or concern
      description: State the mathematical point precisely.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Relevant declaration / section
      placeholder: "Modules/SymplecticTether.lean — DegenerateWRTKineticEnergy; Blueprint.md §2.7"
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: "I understand this repository is a priority snapshot with documented schematic holes and does not claim a completed proof."
