<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frohmanian Symplectic Tether - Kinematic Visualization</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #030305; 
            color: #e0e0e0; 
            font-family: 'Courier New', Courier, monospace; 
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            pointer-events: none;
            background: rgba(5, 5, 10, 0.8);
            padding: 15px;
            border: 1px solid #334;
            border-radius: 4px;
        }
        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            color: #4a90e2;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.9rem;
            margin: 5px 0;
        }
        .highlight {
            color: #50fa7b;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1>SYMPLECTIC TETHER: ENERGY OF DISPLAYED FIELD</h1>
        <p style="max-width:430px;color:#aab">Diagnostics of the <b>displayed</b> particle motion (shader math replicated on CPU). This field is a visual animation, <b>not</b> a Navier–Stokes solution; numbers describe the picture only.</p>
        <p>Vector Count: <span class="highlight">100,000</span> (GPGPU Instanced)</p>
        <p id="metrics">Computing…</p><canvas id="plot" width="430" height="120" style="background:#05050a;border:1px solid #334"></canvas>
        <p id="topology">Status: collecting…</p>
    </div>
    
    <!-- ES Modules import for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ---- energy diagnostics (also in energy_core.js) ----
// Energy diagnostics for the DISPLAYED particle field (CPU replica of the vertex shader).
const fract = x => x - Math.floor(x);
function hash(px,py,pz){
  const a=px*127.1+py*311.7+pz*74.7, b=px*269.5+py*183.3+pz*246.1, c=px*113.5+py*271.9+pz*124.6;
  return [-1+2*fract(Math.sin(a)*43758.5453123), -1+2*fract(Math.sin(b)*43758.5453123), -1+2*fract(Math.sin(c)*43758.5453123)];
}
// Displayed position of base point p at time uTime (same math as the shader).
function displayed(px,py,pz,uTime,out,k){
  const t=uTime*0.5, th=Math.hypot(px,pz)*0.1-t, c=Math.cos(th), s=Math.sin(th);
  let x=c*px+s*pz, y=py, z=-s*px+c*pz;          // GLSL mat2 is column-major
  const n=hash(x*0.2+t,y*0.2+t,z*0.2+t), d=Math.exp(-Math.hypot(x,y,z)*0.05);
  out[k]=x+1.5*n[0]*d; out[k+1]=y+1.5*n[1]*d; out[k+2]=z+1.5*n[2]*d;
}
// Grid: N^3 cells on [-L,L]^3. u = particle-averaged velocity per cell (NGP), 0 in empty cells.
function computeDiagnostics(base, count, time, dt, N=24, L=36){
  const P0=new Float64Array(count*3), P1=new Float64Array(count*3);
  for(let i=0;i<count;i++){ displayed(base[3*i],base[3*i+1],base[3*i+2],time-dt,P0,3*i); displayed(base[3*i],base[3*i+1],base[3*i+2],time,P1,3*i); }
  const h=2*L/N, dV=h*h*h, M=N*N*N, U=new Float64Array(M*3), C=new Float64Array(M);
  for(let i=0;i<count;i++){
    const ix=Math.floor((P1[3*i]+L)/h), iy=Math.floor((P1[3*i+1]+L)/h), iz=Math.floor((P1[3*i+2]+L)/h);
    if(ix<0||iy<0||iz<0||ix>=N||iy>=N||iz>=N) continue;
    const c=(ix*N+iy)*N+iz; C[c]++;
    for(let a=0;a<3;a++) U[3*c+a]+=(P1[3*i+a]-P0[3*i+a])/dt;
  }
  for(let c=0;c<M;c++) if(C[c]) for(let a=0;a<3;a++) U[3*c+a]/=C[c];
  const g=(i,j,k,a)=>(i<0||j<0||k<0||i>=N||j>=N||k>=N)?0:U[3*((i*N+j)*N+k)+a];
  let E=0,Z=0,divRms=0;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)for(let k=0;k<N;k++){
    const c=(i*N+j)*N+k, ux=U[3*c],uy=U[3*c+1],uz=U[3*c+2];
    E+=0.5*(ux*ux+uy*uy+uz*uz)*dV;
    const d=(a,di,dj,dk)=>(g(i+di,j+dj,k+dk,a)-g(i-di,j-dj,k-dk,a))/(2*h); // central differences
    const wx=d(2,0,1,0)-d(1,0,0,1), wy=d(0,0,0,1)-d(2,1,0,0), wz=d(1,1,0,0)-d(0,0,1,0);
    Z+=0.5*(wx*wx+wy*wy+wz*wz)*dV;
    const dv=d(0,1,0,0)+d(1,0,1,0)+d(2,0,0,1); divRms+=dv*dv;
  }
  return {E,Z,divRms:Math.sqrt(divRms/M),N,L,h,count};
}
function classify(hist){ // hist: [{t,E}], last ~2 s
  if(hist.length<5) return 'collecting…';
  const a=hist[0],b=hist[hist.length-1], rel=(b.E-a.E)/Math.max(Math.abs(a.E),1e-12);
  return Math.abs(rel)<0.01?'E roughly flat (|ΔE/E|<1% over window) — not a conservation proof':rel>0?'E INCREASING':'E DECREASING';
}
if(false&&typeof module!=='undefined') module.exports={displayed,computeDiagnostics,classify,hash};

        // 1. Core Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(40, 30, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // 2. Data Structure: Instanced Mesh for 100k Vectors
        const VECTOR_COUNT = 100000;
        const geometry = new THREE.ConeGeometry(0.15, 0.8, 4);
        geometry.translate(0, 0.4, 0);
        geometry.rotateX(Math.PI / 2); // Align with Z-axis for lookAt

        // Custom GLSL Shader for real-time symplectic displacement & vorticity mapping
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0.0 },
                uColorStart: { value: new THREE.Color("#4a90e2") }, // Deep fluid blue
                uColorEnd: { value: new THREE.Color("#ff5555") }    // High vorticity red
            },
            vertexShader: `
                uniform float uTime;
                
                attribute vec3 instancePosition;
                attribute vec3 instanceBase;
                
                varying vec3 vColor;
                
                // Simplex noise approximation for fluid turbulence
                vec3 hash( vec3 p ) {
                    p = vec3( dot(p,vec3(127.1,311.7, 74.7)),
                              dot(p,vec3(269.5,183.3,246.1)),
                              dot(p,vec3(113.5,271.9,124.6)));
                    return -1.0 + 2.0*fract(sin(p)*43758.5453123);
                }

                void main() {
                    // Base coordinates
                    vec3 pos = instancePosition;
                    
                    // Apply geometric boundary constraints (Symplectic displacement)
                    float t = uTime * 0.5;
                    
                    // Non-linear rotational field modeling vorticity
                    float theta = length(pos.xz) * 0.1 - t;
                    mat2 rot = mat2(cos(theta), -sin(theta), sin(theta), cos(theta));
                    pos.xz = rot * pos.xz;
                    
                    // Add bounded turbulence
                    vec3 noise = hash(pos * 0.2 + t) * 1.5;
                    pos += noise * exp(-length(pos) * 0.05); // Decay at boundaries
                    
                    // Calculate local vorticity magnitude for color mapping
                    float vorticity = length(noise) / 1.5; 
                    vColor = mix(vec3(0.1, 0.3, 0.8), vec3(1.0, 0.1, 0.2), clamp(vorticity, 0.0, 1.0));
                    
                    // Transform final position
                    vec4 mvPosition = modelViewMatrix * vec4(pos + position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    // Output raw color mapped from mathematical bounds
                    gl_FragColor = vec4(vColor, 0.9);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const instancedMesh = new THREE.InstancedMesh(geometry, material, VECTOR_COUNT);
        
        // 3. Mathematical Population of the Vector Field
        const dummy = new THREE.Object3D();
        const positions = new Float32Array(VECTOR_COUNT * 3);
        
        let i = 0;
        const RADIUS = 35;
        
        // Populate a bounded torus to represent the tether volume
        for (let x = 0; x < VECTOR_COUNT; x++) {
            // Toroidal distribution
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI * 2;
            const R = 20; // Major radius
            const r = 10 * Math.random(); // Minor radius variance
            
            const px = (R + r * Math.cos(v)) * Math.cos(u);
            const py = r * Math.sin(v);
            const pz = (R + r * Math.cos(v)) * Math.sin(u);
            
            positions[i*3] = px;
            positions[i*3+1] = py;
            positions[i*3+2] = pz;
            
            dummy.position.set(px, py, pz);
            
            // Align vectors tangentially to simulate flow
            const target = new THREE.Vector3(-Math.sin(u), 0, Math.cos(u));
            dummy.lookAt(dummy.position.clone().add(target));
            dummy.updateMatrix();
            
            instancedMesh.setMatrixAt(i, dummy.matrix);
            i++;
        }
        
        geometry.setAttribute('instancePosition', new THREE.InstancedBufferAttribute(positions, 3));
        scene.add(instancedMesh);

        // 4. HTML5 Canvas 2D Telemetry Overlay (Anchored in 3D Space)
        const canvas2d = document.createElement('canvas');
        canvas2d.width = 1024;
        canvas2d.height = 1024;
        const ctx = canvas2d.getContext('2d');
        const hudTexture = new THREE.CanvasTexture(canvas2d);
        
        const hudMaterial = new THREE.MeshBasicMaterial({ 
            map: hudTexture, 
            transparent: true, 
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthTest: false
        });
        const hudGeometry = new THREE.PlaneGeometry(30, 30);
        const hudMesh = new THREE.Mesh(hudGeometry, hudMaterial);
        scene.add(hudMesh);

        function updateTelemetry(time) {
            ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
            
            // Outer Geometric Boundary Ring
            ctx.strokeStyle = 'rgba(80, 250, 123, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(512, 512, 450, 0, Math.PI * 2);
            ctx.stroke();
            
            // Inner Target Ring
            ctx.strokeStyle = 'rgba(74, 144, 226, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(512, 512, 200, 0, Math.PI * 2);
            ctx.stroke();
            
            // Crosshairs aligned with exact center of mass
            ctx.beginPath();
            ctx.moveTo(512, 50);
            ctx.lineTo(512, 974);
            ctx.moveTo(50, 512);
            ctx.lineTo(974, 512);
            ctx.stroke();
            
            // Real-time formal auditing text
            ctx.fillStyle = '#50fa7b';
            ctx.font = '24px Courier New';
            ctx.fillText('DISPLAYED-FIELD DIAGNOSTICS (not an NS solve)', 50, 80);
            ctx.fillStyle = '#ffb86c';
            ctx.fillText(diag ? 'rms ∇·u (grid FD) = ' + diag.divRms.toExponential(3) : 'rms ∇·u: computing…', 50, 115);
            
            // Render the canvas texture update to the GPU
            hudTexture.needsUpdate = true;
            
            // Update HTML DOM metrics
            if (time - lastDiagT >= 0.25) runDiagnostics(time);
        }

        // Diagnostics: E = ½Σ|u|²ΔV, Z = ½Σ|ω|²ΔV, ω = central-difference curl on a 24³ grid
        const SAMPLE = 20000, sampleBase = new Float64Array(SAMPLE*3);
        for (let k=0;k<SAMPLE;k++){ const j=Math.floor(k*VECTOR_COUNT/SAMPLE); for(let a=0;a<3;a++) sampleBase[3*k+a]=positions[3*j+a]; }
        let diag=null, lastDiagT=-1; const hist=[];
        function runDiagnostics(time){
            const d=computeDiagnostics(sampleBase,SAMPLE,time,1/60);
            const prev=hist.length?hist[hist.length-1]:null;
            d.dEdt = prev ? (d.E-prev.E)/(time-prev.t) : NaN;
            hist.push({t:time,E:d.E,Z:d.Z}); while(hist.length>120) hist.shift();
            diag=d; lastDiagT=time; window.__diag={...d,t:time,hist:hist.slice()};
            const f=x=>Number.isFinite(x)?x.toExponential(4):'—';
            document.getElementById('metrics').innerHTML=
              `t = ${time.toFixed(2)} s<br>E = <span class="highlight">${f(d.E)}</span> &nbsp; Z = <span class="highlight">${f(d.Z)}</span><br>dE/dt = ${f(d.dEdt)} &nbsp; (sample ${SAMPLE} of ${VECTOR_COUNT}, grid ${d.N}³, h=${d.h.toFixed(2)})`;
            const recent=hist.filter(p=>p.t>=time-2);
            document.getElementById('topology').textContent='Status: '+classify(recent);
            const pc=document.getElementById('plot').getContext('2d'),W=430,H=120; pc.clearRect(0,0,W,H);
            const draw=(key,col)=>{const v=hist.map(p=>p[key]),lo=Math.min(...v),hi=Math.max(...v),sp=(hi-lo)||1;
              pc.strokeStyle=col;pc.beginPath();hist.forEach((p,i)=>{const x=i/(119)*W,y=H-8-(p[key]-lo)/sp*(H-16);i?pc.lineTo(x,y):pc.moveTo(x,y);});pc.stroke();};
            draw('E','#50fa7b'); draw('Z','#ff79c6');
            pc.fillStyle='#aab';pc.font='11px monospace';pc.fillText('E (green), Z (pink), each auto-scaled, last 30 s',6,12);
        }

        // 5. Strictly Decoupled Render Loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            
            // Update custom GPGPU shader time
            material.uniforms.uTime.value = time;
            
            // Keep Telemetry HUD facing the exact camera angle (Billboard effect)
            hudMesh.quaternion.copy(camera.quaternion);
            updateTelemetry(time);
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle browser resizing seamlessly
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
